name: Desktop Tests

on:
  push:
    branches:
      - Dev
  workflow_dispatch:
    inputs:
      test_filter:
        description: Space-separated Gradle --tests filter patterns (pass "all" for the full desktopTest suite)
        required: false
        type: string
        default: com.nuvio.app.core.ui.CinemaObsidianThemeTest com.nuvio.app.features.membership.ThemeAccessTest com.nuvio.app.core.ui.DesktopNavigationBarTest com.nuvio.app.core.ui.HeroStretchOverscrollTest com.nuvio.app.features.home.components.HomeHeroLayoutTest com.nuvio.app.features.home.components.HomeHeroSectionTest com.nuvio.app.features.home.HomeCategoryFilterTest com.nuvio.app.features.details.components.DetailSeriesContentWheelScrollTest com.nuvio.app.features.trakt.TraktIdUtilsTest com.nuvio.app.features.trakt.TraktTrackingLibraryProviderTest com.nuvio.app.features.details.EpisodeRatingsAlignmentTest com.nuvio.app.features.tmdb.TmdbMetadataServiceTest

jobs:
  desktop-tests:
    name: Desktop Compile, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Player Web UI JS & XML Resources
        run: |
          node --check composeApp/src/desktopMain/resources/player-ui/controls.js
          node --check composeApp/src/desktopMain/resources/player-ui/party.js
          python3 -c "import xml.etree.ElementTree as ET; [ET.parse(p) for p in ('composeApp/packaging/windows/main.wxs', 'composeApp/src/commonMain/composeResources/values/strings.xml', 'composeApp/src/commonMain/composeResources/values-ar/strings.xml')]; print('XML_OK')"

      - name: Ensure local.properties exists
        run: |
          if [[ ! -f local.properties ]]; then
            : > local.properties
          fi

      - name: Compile Desktop & Run Unit Tests
        env:
          TEST_FILTER: ${{ inputs.test_filter || 'com.nuvio.app.core.ui.CinemaObsidianThemeTest com.nuvio.app.features.membership.ThemeAccessTest com.nuvio.app.core.ui.DesktopNavigationBarTest com.nuvio.app.core.ui.HeroStretchOverscrollTest com.nuvio.app.features.home.components.HomeHeroLayoutTest com.nuvio.app.features.home.components.HomeHeroSectionTest com.nuvio.app.features.home.HomeCategoryFilterTest com.nuvio.app.features.details.components.DetailSeriesContentWheelScrollTest com.nuvio.app.features.trakt.TraktIdUtilsTest com.nuvio.app.features.trakt.TraktTrackingLibraryProviderTest com.nuvio.app.features.details.EpisodeRatingsAlignmentTest com.nuvio.app.features.tmdb.TmdbMetadataServiceTest' }}
        run: |
          set -euo pipefail
          test_args=()
          if [ -n "${TEST_FILTER:-}" ]; then
            read -r -a filter_patterns <<< "${TEST_FILTER}"
            if ! ( [ "${#filter_patterns[@]}" -eq 1 ] && [ "${filter_patterns[0]}" = "all" ] ); then
              for pattern in ${filter_patterns[@]+"${filter_patterns[@]}"}; do
                if [ -n "${pattern}" ]; then
                  test_args+=(--tests "${pattern}")
                fi
              done
            fi
          fi
          ./gradlew \
            :composeApp:desktopMainClasses \
            :composeApp:desktopTest \
            ${test_args[@]+"${test_args[@]}"} \
            -x :composeMediaPlayer:buildNativeLinux \
            -x :composeApp:buildLinuxPlayerBridge \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

      - name: Upload Desktop Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-report
          path: composeApp/build/reports/tests/desktopTest
          if-no-files-found: ignore
          retention-days: 7
